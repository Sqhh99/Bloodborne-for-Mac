# Publishes a version as one GitHub release, v<version>, with both editions (docs/RELEASES.md):
#   Bloodborne-macOS-<version>-singleplayer.zip   no online module
#   Bloodborne-macOS-<version>-multiplayer.zip    with the online module
# Start it by pushing a tag v<version> (git tag v0.1.1 && git push origin v0.1.1), or from the
# Actions tab with the version (the tag is then created at the chosen branch's head).
# A version with a suffix (0.1.2-test1) is published as a pre-release. Release notes come from
# docs/releases/v<version>.md when it exists. (0.1.0 was published as two releases,
# v0.1.0-singleplayer and v0.1.0-multiplayer; the launcher reads both forms.)
name: Release

on:
  push:
    tags: ['v*', '!v*-singleplayer', '!v*-multiplayer']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v (0.1.0)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then version=${GITHUB_REF_NAME#v}; else version=${INPUT#v}; fi
          [[ $version =~ ^[0-9]+(\.[0-9]+)+(-[A-Za-z0-9.]+)?$ && $version != *-singleplayer && $version != *-multiplayer ]] ||
              { echo "::error::not a version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          name: Bloodborne-macOS
          path: dist
      - name: One release with both editions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag=v$VERSION
          flags=(--latest)
          [[ $VERSION == *-* ]] && flags=(--prerelease --latest=false)
          notes_file=docs/releases/v$VERSION.md
          {
              echo "Two downloads, built from the same commit; pick one:"
              echo
              echo "| Edition | Download | Online play |"
              echo "|---|---|---|"
              echo "| **Single-player** | \`Bloodborne-macOS-$VERSION-singleplayer.zip\` | none: no online module and no **Online** tab; the game never connects to the network |"
              echo "| **Multiplayer** | \`Bloodborne-macOS-$VERSION-multiplayer.zip\` | messages, bloodstains, bells and summons through The Hunter's Dream or shadNet, set up on the launcher's **Online** tab (off until you turn it on). Includes GPL-3.0-or-later code: docs/ONLINE_PROVENANCE.md |"
              echo
              echo "Both need an Apple Silicon Mac with macOS 15 or newer, 16 GB of memory and your own decrypted copy of the game (CUSA03173 v1.09). The apps are not notarised: after unzipping, run \`xattr -dr com.apple.quarantine Bloodborne.app\`. Each app updates itself to the same edition. Setup: README.md."
              echo
              if [[ -f $notes_file ]]; then cat "$notes_file"; else echo "Changes: docs/CHANGELOG.md."; fi
          } > notes.md
          assets=("dist/Bloodborne-macOS-$VERSION-singleplayer.zip" "dist/Bloodborne-macOS-$VERSION-multiplayer.zip"
                  dist/pkg_extract-macOS.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${assets[@]}" --clobber
          else
              gh release create "$tag" --target "$GITHUB_SHA" --title "Bloodborne for Mac $VERSION" \
                  --notes-file notes.md "${flags[@]}" "${assets[@]}"
          fi
